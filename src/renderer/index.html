<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Flow Launcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">Flow Launcher</div>
    </header>

    <main>
      <section class="top">
        <div class="tiles" id="tiles">
          <div class="group">
            <div class="group-head-row">
              <h2 class="group-head">Backend</h2>
              <label class="args" title="Appended to wispr-dev up. Takes effect the next time the backend starts.">
                <span>args</span>
                <input id="backend-args" placeholder="e.g. --with-soniox-tunnel" spellcheck="false" autocomplete="off" />
              </label>
            </div>
            <div class="group-tiles">
              <div class="tile" role="button" tabindex="0" data-tile="backend" data-env="local" data-hint="wispr-dev up">
                <div class="tile-title">Local</div>
                <div class="tile-foot"><span class="pill"></span><span class="tile-where"></span></div>
              </div>
            </div>
          </div>
          <div class="group">
            <div class="group-tiles group-heads">
              <h2 class="group-head">Installed app</h2>
              <h2 class="group-head span-rest">Local build</h2>
            </div>
            <div class="group-tiles">
              <div class="tile" role="button" tabindex="0" data-tile="prod" data-env="installed" data-hint="/Applications/Wispr Flow.app · prod backend">
                <div class="tile-title">Wispr Flow</div>
                <div class="tile-foot"><span class="pill"></span><span class="tile-where"></span></div>
              </div>
              <div class="tile" role="button" tabindex="0" data-tile="local-prod" data-env="prod" data-hint="yarn start">
                <div class="tile-title">Prod</div>
                <div class="tile-foot"><span class="pill"></span><span class="tile-where"></span></div>
              </div>
              <div class="tile" role="button" tabindex="0" data-tile="local-staging" data-env="staging" data-hint="yarn start staging-backend · api-east.wisprflow.ai · your real login">
                <div class="tile-title">Staging</div>
                <div class="tile-foot"><span class="pill"></span><span class="tile-where"></span></div>
              </div>
              <div class="tile" role="button" tabindex="0" data-tile="local-local" data-env="local" data-hint="yarn start dev-backend · signs in as dev@wispr.ai">
                <div class="tile-title">Local</div>
                <div class="tile-foot"><span class="pill"></span><span class="tile-where"></span></div>
              </div>
            </div>
          </div>
        </div>

        <div class="side">
        <section class="panel worktree">
          <div class="worktree-heading">
            <h2>Worktrees / branches</h2>
            <button id="refresh-worktrees" class="icon-btn" title="Refresh worktrees">↻</button>
          </div>
          <label class="worktree-row" for="backend-worktree">
            <span>Backend</span>
            <select id="backend-worktree"></select>
          </label>
          <label class="worktree-row" for="desktop-worktree">
            <span>Frontend (desktop)</span>
            <select id="desktop-worktree"></select>
          </label>
          <div class="hint">Applies on next launch. Local desktop connects to the selected backend.</div>
        </section>

        <aside class="panel flags">
          <div class="flags-head">
            <h2>Feature flags</h2>
            <span class="hint">Local desktop only · applies on next launch</span>
          </div>
          <form id="flag-form" autocomplete="off">
            <input id="flag-input" list="known-flags" placeholder="flag-name or flag-name=variant" spellcheck="false" />
            <datalist id="known-flags"></datalist>
          </form>
          <ul id="flag-list"></ul>
          <div id="flag-empty" class="empty">No overrides yet. Everything follows PostHog.</div>
        </aside>
        </div>
      </section>

      <section class="logs" id="logs">
        <div class="logs-bar">
          <button id="logs-toggle" class="icon-btn" title="Show/hide logs">▾</button>
          <div class="tabs" id="log-tabs">
            <button data-key="backend">Backend<span class="badge"></span></button>
            <button data-key="desktop">Desktop<span class="badge"></span></button>
            <button data-key="launcher">Launcher<span class="badge"></span></button>
          </div>
          <input id="log-filter" placeholder="Filter" spellcheck="false" />
          <label class="check"><input type="checkbox" id="errors-only" /> Errors only</label>
          <button id="log-clear" class="text-btn">Clear</button>
        </div>
        <div class="log-view" id="log-view"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
