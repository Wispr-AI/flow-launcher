<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d36"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f323a"/>
      <stop offset="1" stop-color="#1e2025"/>
    </linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee3a6"/>
      <stop offset="1" stop-color="#22a86b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px squircle centered in 1024 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- tiles -->
  <rect x="208" y="208" width="282" height="282" rx="56" fill="url(#tile)"/>
  <rect x="534" y="208" width="282" height="282" rx="56" fill="url(#tile)"/>
  <rect x="208" y="534" width="282" height="282" rx="56" fill="url(#tile)"/>

  <!-- the live tile -->
  <rect x="534" y="534" width="282" height="282" rx="56" fill="#3ecf8e" opacity="0.55" filter="url(#glow)"/>
  <rect x="534" y="534" width="282" height="282" rx="56" fill="url(#live)"/>
  <polygon points="652,622 652,728 744,675" fill="#0e1a14" stroke="#0e1a14" stroke-width="24" stroke-linejoin="round" opacity="0.9"/>

  <!-- status dots on idle tiles -->
  <circle cx="262" cy="436" r="16" fill="#4a4e58"/>
  <circle cx="588" cy="436" r="16" fill="#4a4e58"/>
  <circle cx="262" cy="762" r="16" fill="#4a4e58"/>
</svg>
